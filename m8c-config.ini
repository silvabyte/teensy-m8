; m8c config tuned for Steam Controller via sc-controller's XInput emulation.
; Copy to ~/.local/share/m8c/config.ini (run.sh does this for you).
;
; Button numbers are SDL_GameControllerButton enum values:
;   0=A  1=B  2=X  3=Y  4=BACK  5=GUIDE  6=START  7=LSTICK  8=RSTICK
;   9=LSHOULDER  10=RSHOULDER  11=DPAD_UP  12=DPAD_DOWN  13=DPAD_LEFT  14=DPAD_RIGHT

[graphics]
fullscreen = false
use_gpu = true
idle_ms = 10
wait_for_device = true
wait_packets = 1024
audio_enabled = false
audio_buffer_size = 1024
audio_device_name = Default

[keyboard]
key_up = 82
key_left = 80
key_down = 81
key_right = 79
key_select = 29
key_select_alt = 44
key_start = 27
key_start_alt = 224
key_opt = 4
key_opt_alt = 226
key_edit = 22
key_edit_alt = 225
key_delete = 76
key_reset = 21
key_jazz_inc_octave = 38
key_jazz_dec_octave = 36
key_jazz_inc_velocity = 41
key_jazz_dec_velocity = 39

[gamepad]
gamepad_up = 11
gamepad_down = 12
gamepad_left = 13
gamepad_right = 14
gamepad_select = 3
gamepad_start = 6
gamepad_opt = 1
gamepad_edit = 0
gamepad_quit = 5
gamepad_reset = 7
gamepad_analog_threshold = 24000
gamepad_analog_invert = false
gamepad_analog_axis_updown = 1
gamepad_analog_axis_leftright = 0
gamepad_analog_axis_start = 5
gamepad_analog_axis_select = 4
gamepad_analog_axis_opt = -1
gamepad_analog_axis_edit = -1
